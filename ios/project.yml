name: Kognit
options:
  bundleIdPrefix: com.quyen244
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  Kognit:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Kognit
    settings:
      base:
        INFOPLIST_FILE: $(SRCROOT)/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.quyen244.kognit
        GENERATE_INFOPLIST_FILE: NO
