name: Build iOS IPA Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate --spec project.yml

      - name: Build Xcode Archive
        run: |
          cd ios
          xcodebuild archive \
            -project Kognit.xcodeproj \
            -scheme Kognit \
            -archivePath build/Kognit.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -r build/Kognit.xcarchive/Products/Applications/Kognit.app Payload/
          zip -r Kognit.ipa Payload/
          echo "IPA build complete: $(ls -lh Kognit.ipa)"

      - name: Upload Kognit IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kognit-iOS-IPA
          path: ios/Kognit.ipa
