name: Build iOS IPA Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Compile iOS App & Package IPA
        run: |
          cd ios
          swift build -c release --triple arm64-apple-ios18.0 -Xswiftc -sdk -Xswiftc $(xcrun --sdk iphoneos --show-sdk-path) 2>&1 | tee build.log || swift build -c release 2>&1 | tee -a build.log
          
          BIN_PATH=$(find .build -type f -name Kognit -perm +111 | head -n 1)
          echo "Found binary at: $BIN_PATH"
          
          mkdir -p Payload/Kognit.app
          cp "$BIN_PATH" Payload/Kognit.app/Kognit
          cp Info.plist Payload/Kognit.app/Info.plist
          
          zip -r Kognit.ipa Payload
          echo "IPA build complete: $(ls -lh Kognit.ipa)"

      - name: Upload Kognit IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kognit-iOS-IPA
          path: ios/Kognit.ipa

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IPA-Build-Log
          path: ios/build.log
