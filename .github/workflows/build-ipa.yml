name: Build iOS IPA Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project & Build IPA
        run: |
          cd ios
          xcodegen generate
          
          xcodebuild -project Kognit.xcodeproj \
            -scheme Kognit \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          
          APP_PATH=$(find build -name "Kognit.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Kognit.app
          zip -r Kognit.ipa Payload
          echo "IPA build complete: $(ls -lh Kognit.ipa)"

      - name: Upload Kognit IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kognit-iOS-IPA
          path: ios/Kognit.ipa
