name: Build iOS Simulator App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build for iOS Simulator
        run: |
          cd ios
          mkdir -p build/Kognit.app
          swift build -c release --triple arm64-apple-ios17.0-simulator || swift build -c release
          cd build
          zip -r Kognit-Simulator.app.zip Kognit.app

      - name: Upload iOS Simulator Build
        uses: actions/upload-artifact@v4
        with:
          name: Kognit-iOS-Simulator
          path: ios/build/Kognit-Simulator.app.zip
