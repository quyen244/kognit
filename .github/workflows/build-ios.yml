name: Build iOS Simulator App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build for iOS Simulator
        run: |
          cd ios
          SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          echo "Using iPhoneSimulator SDK at $SDK_PATH"
          
          SWIFT_FILES=$(find Kognit -name "*.swift")
          
          swiftc -target arm64-apple-ios18.0-simulator \
            -sdk "$SDK_PATH" \
            -parse-as-library \
            -framework SwiftUI \
            -framework SwiftData \
            -framework VisionKit \
            -framework AVFoundation \
            -emit-executable \
            -o Kognit \
            $SWIFT_FILES
          
          mkdir -p build/Kognit.app
          cp Kognit build/Kognit.app/Kognit
          cp Info.plist build/Kognit.app/Info.plist
          
          cd build
          zip -r Kognit-Simulator.app.zip Kognit.app

      - name: Upload iOS Simulator Build
        uses: actions/upload-artifact@v4
        with:
          name: Kognit-iOS-Simulator
          path: ios/build/Kognit-Simulator.app.zip
