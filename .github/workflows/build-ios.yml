name: Build iOS Simulator App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build for iOS Simulator
        run: |
          cd ios
          swift build -c release --triple arm64-apple-ios18.0-simulator -Xswiftc -sdk -Xswiftc $(xcrun --sdk iphonesimulator --show-sdk-path) 2>&1 | tee build.log || swift build -c release 2>&1 | tee -a build.log
          
          BIN_PATH=$(find .build -type f -name Kognit -perm +111 | head -n 1)
          echo "Found binary at: $BIN_PATH"
          
          mkdir -p build/Kognit.app
          cp "$BIN_PATH" build/Kognit.app/Kognit
          cp Info.plist build/Kognit.app/Info.plist
          
          cd build
          zip -r Kognit-Simulator.app.zip Kognit.app

      - name: Upload iOS Simulator Build
        uses: actions/upload-artifact@v4
        with:
          name: Kognit-iOS-Simulator
          path: ios/build/Kognit-Simulator.app.zip

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Simulator-Build-Log
          path: ios/build.log
