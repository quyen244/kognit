name: Build iOS Simulator App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project & Build Simulator App
        run: |
          cd ios
          xcodegen generate
          
          xcodebuild -project Kognit.xcodeproj \
            -scheme Kognit \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          
          APP_PATH=$(find build -name "Kognit.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          
          mkdir -p sim-build
          cp -r "$APP_PATH" sim-build/Kognit.app
          cd sim-build
          zip -r Kognit-Simulator.app.zip Kognit.app

      - name: Upload iOS Simulator Build
        uses: actions/upload-artifact@v4
        with:
          name: Kognit-iOS-Simulator
          path: ios/sim-build/Kognit-Simulator.app.zip
