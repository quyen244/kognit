name: Build iOS Simulator App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate --spec project.yml

      - name: Build Simulator App
        run: |
          cd ios
          set -o pipefail
          xcodebuild \
            -project Kognit.xcodeproj \
            -scheme Kognit \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log || {
              echo "=== XCODEBUILD ERROR SUMMARY ==="
              grep -E "error:" xcodebuild.log || tail -n 60 xcodebuild.log
              exit 1
            }

      - name: Package Simulator App Bundle
        run: |
          cd ios
          APP_PATH=$(find build/Build/Products -name "Kognit.app" -type d | head -n 1)
          echo "Found simulator app at: $APP_PATH"
          mkdir -p sim-build
          cp -r "$APP_PATH" sim-build/Kognit.app
          cd sim-build && zip -r Kognit-Simulator.app.zip Kognit.app

      - name: Upload iOS Simulator Build
        uses: actions/upload-artifact@v4
        with:
          name: Kognit-iOS-Simulator
          path: ios/sim-build/Kognit-Simulator.app.zip

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-xcodebuild-log
          path: ios/xcodebuild.log
